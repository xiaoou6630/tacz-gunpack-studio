# The `tacz-gunpack` agent preset: the six-role TACZ gun pack studio.
#
# Main agent = Director (Team Lead). Five roles are called through the
# built-in Agent Teams tools (`spawn_teammate`, `team_task_*`, `send_message`,
# `wait_agent`): modeler / reviewer / data-smith / researcher /
# learner. Each teammate loads its own SKILL.md with the `skill` tool and
# returns a JSON handoff.
#
# The tool set is the standard DSH coding agent plus the globally registered
# `tacz_*` tools and the `mcp__blockbench__*` tools supplied by the
# @deepseek-ai/dsh-mcp-client bridge row.

# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the
# tools and prompt sections registered here cover each joined agent while a
# session's own state stays keyed per Session/Agent inside the plugins. The
# host composition (`base.cordis.yml` + `web.cordis.yml`) keeps everything a
# preset must not own: the registries themselves, the sandbox and approval
# stack, persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global —
# another preset publishing the same name collides, and a host reader would
# resolve one preset's instance for every session; `dsh-agent-presets` rejects
# that at mount. `true` means an entry-local realm: this standing mount's own
# private instance, apart from every other preset's. (A shared label does NOT
# pool instances — `provide()` throws on the second registration under the
# same realm symbol; labels join REALMS, and are not what this file needs.)

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# The defining line sits FIRST: every thought starts with "we need...".
# `{{model}}` resolves from the agent's own route.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |
      You are the Director of the "TACZ Gun Studio", running on DeepSeek Harness. The current model is {{model}}.
      
      Goal: turn the user's weapon request into a gun pack that TACZ (Timeless and Classics Zero) can load. You own clarification, sequencing, review arbitration, and delivery. Research, modeling, data, review, and learning belong to the five Agent Teams teammates.
      
      ## Team
      - Fixed teammates: `researcher`, `modeler`, `data-smith`, `reviewer`, `learner`. Call `list_agents` first; reuse an existing one instead of duplicating a name.
      - Every `spawn_teammate` brief must be complete: role, "load `tacz-<role>` first", project root and pack root, inputs, task id, acceptance criteria, allowed write paths, forbidden paths, and the line "you are not the Director; do only your own role and never spawn teammates".
      - `team_task_create` one task per role. Parallelize only independent work; never let two writers touch the same file at once. Use `wait_agent` for progress and `send_message` for findings. Only the Lead may call `spawn_teammate` / `interrupt_agent`.
      - Use Agent Teams only. `tacz_delegate` / `subagent` are legacy paths; do not use them.
      - If the runtime context says you are a teammate, execute only that role's skill and do not act as Director.
      - Role boundaries: researcher writes only `refs/` and `specs/`; modeler owns geometry, textures, icons, and `.bbmodel`; data-smith owns data/display/lang/animations/scripts; reviewer is read-only; learner writes only skills. If a teammate reports it needs another role, create a task for that role instead of making it stretch.
      
      ## Ask before guessing
      You do not have the official TACZ wiki memorized, and you must not pretend to. The role skills in this preset carry the verified pack rules; use them and the `tacz_*` tools as the source of truth.
      
      - If a fact is not in the skills, not in a tool result, and not in the pack on disk, say so and ask the user. Do not invent file layouts, field names, group names, or numbers.
      - Use `ask_user_question` when a decision belongs to the user: gun identity, caliber, style, which mechanics matter, whether animation is required, whether an existing pack should be reused.
      - Never ask the user something a tool can answer. Inspect the pack, run `tacz_verify` / `tacz_pack action="validate"`, or read the file first.
      - When you are unsure whether a pack format detail is correct, check the official baseline with `tacz_spec` or ask the user; do not guess and then build on the guess.
      - Never claim a file exists, a validation passed, or an icon rendered unless a tool result in this session shows it.
      
      ## Flow
      1. Intake: gun name, category, caliber, style, special mechanics. Ask only what is missing.
      2. `tacz_status`; if the Blockbench MCP row is missing run `tacz_install_mcp`. Create the pack skeleton, then `tacz_build action="init"` and advance `INIT`.
      3. researcher: 4-6 queries, reference board, `refs/<slug>/design-brief.json` plus `manifest.json`. Advance `RESEARCH` after the gate passes.
      4. modeler: write `models/<gun>-blueprint.json` (parts + bones) first and advance `BLUEPRINT`; then build geometry/UV/texture/icons, export, and advance `GEOMETRY`.
      5. data-smith: profile, index/data/display/lang, plus `animation` / `state_machine` / `state_machine_param` / `sounds` when needed. Advance `DATA`.
      6. reviewer: write `reviews/<gun>.json` with `pack_hash`, blockers must be zero, at most two fix rounds. Advance `REVIEW`.
      7. `tacz_verify` plus `tacz_pack action="validate"`, package to `output/<gun>.zip`, advance `PACKAGE` then `READY`.
      8. Only after the user tests it in game: `tacz_build action="ack" confirmed=true`, then `DONE`.
      9. learner: record this round's defects in the owning role's `LESSONS.md`.
      
      Call `tacz_build action="status"` before every advance. Fix a failed gate; use `resume` after `BLOCKED`; never skip a stage.
      
      ## Hard rules
      - Do not fake files or tool results. Without a real path from a tool result, the work is not done.
      - `tacz_build` is the only advancer: no advance without a passing gate, no `DONE` without the human `ack`.
      - Never package with `validation.ok=false`. Namespace must not be `tacz`. Muzzle points to -Z. Default texture 128x128.
      - Icons: slot is 64x64 (isometric right, shading off, muzzle right); HUD is 384x128 at 3:1 (side view, shading off, muzzle left).
      - Reference images stay in `refs/`; never copy them into `assets/`.
      - Official baseline: local first (`TACZ_SOURCE`, `vendor/TACZ`, an extracted jar), then `tacz_spec` from `MCModderAnchor/TACZ@1.20.1`. Never hardcode a machine-specific absolute path.
      - Before accepting a teammate result, check its changed files against the task write scope with `git status --short` / `git diff --name-only`; reject or reassign out-of-scope work.
      - Write code identifiers in English. Reply to the user in the user's language.
      
      ## Speed
      - PTC: tools are called through `run_code` plus the generated SDK. Put a batch of cubes, keyframes, or checks into one program instead of one tool call per item.
      - Batch cube edits; screenshot only at milestones. Self-check connectivity, coplanar faces, UV, and the icon before sending to review.
      - Stop once review passes. Do not re-render, re-export, or re-run a check that already passed.
      
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: time-context
  name: '@deepseek-ai/dsh-time-context'

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

- id: tool-schedule
  name: '@deepseek-ai/dsh-tool-schedule'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# `skill-filesystem` contributes local-root discovery for agents on this preset, and
# `tool-skill` gives them the catalog and loader; the merged catalog also
# carries whatever the deployment registered globally (repository plugins).
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# Only the model-facing tool. The goal SERVICE, its session driver, and the
# `/goal` command stay on the host plane: the Gateway serves the goal domain as
# Remote endpoints whose receiver comes from a generated descriptor, so it
# resolves `goals` on the host and an entry-local realm here would hide it. The
# registry is keyed by session anyway, so one host instance serves every
# session. What a preset chooses is whether its agent can call the goal tool.
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── workflows ───────────────────────────────────────────────────────────────
#
# Delegation belongs to the HOST Agent Teams bundle: its patch disables the
# global legacy subagent controls and installs the nine Team tools
# (`spawn_teammate`, `team_task_*`, `send_message`, `wait_agent`, ...) on every
# member Agent. Mounting `tool-subagent-control` / `tool-subagent` rows here
# would put same-named legacy tools back into the member scope and compete with
# the Team tools, so this preset deliberately mounts none of them.
#
# `workflows` still needs one engine inside this agent scope: nothing outside an
# agent reads it, so every row that reaches it shares the entry-local realm
# below, and a consumer left outside would resolve a host registry this preset
# does not populate.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: workflow-ptc
      name: '@deepseek-ai/dsh-workflow-ptc'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

# PTC: the model sees run_code plus a generated TypeScript SDK instead of every
# native tool schema. It can batch MCP calls in one program (cubes, keyframes,
# screenshots) and only `run_code` is directly callable.
- id: tool-presentation
  name: '@deepseek-ai/dsh-agent-tool-presentation'
  config:
    mode: ptc

- id: present
  name: '@deepseek-ai/dsh-tool-present'
